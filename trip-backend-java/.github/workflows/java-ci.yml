name: Java CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  # Job 1: 单元测试
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: trip_pass
          POSTGRES_DB: trip_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test -Dtest="!*IntegrationTest" -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trip_db
          SPRING_DATASOURCE_USERNAME: trip
          SPRING_DATASOURCE_PASSWORD: trip_pass
          SPRING_REDIS_HOST: localhost
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # Job 2: 集成测试（使用 H2）
  integration-test:
    name: Integration Test (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests (H2)
        run: mvn test -Dtest="*IntegrationTest" -Dspring.profiles.active=test -B
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # Job 3: 构建验证
  build:
    name: Build Verify
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-backend-jar
          path: target/*.jar
          retention-days: 7

  # Job 4: 契约测试（可选，需要 Python 服务）
  contract-test:
    name: Contract Test (Dual-run)
    runs-on: ubuntu-latest
    needs: [build]
    # 仅手动触发或定时任务
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Python backend
        uses: actions/checkout@v4
        with:
          repository: your-org/trip-backend
          path: trip-backend-py
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies (Python)
        working-directory: trip-backend-py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run dual-run comparison
        run: |
          # 启动 Python 服务
          cd trip-backend-py && source .venv/bin/activate && uvicorn main:app --host 0.0.0.0 --port 8001 &
          PYTHON_PID=$!

          # 等待服务启动
          sleep 10

          # 运行 dual-run 脚本
          cd ${{ github.workspace }}
          chmod +x scripts/e2e/dual-run.sh
          bash scripts/e2e/dual-run.sh || true

          # 清理
          kill $PYTHON_PID || true

        env:
          PYTHON_URL: http://localhost:8001
          JAVA_URL: http://localhost:8080

      - name: Upload dual-run report
        uses: actions/upload-artifact@v4
        with:
          name: dual-run-report
          path: docs/e4/dual-run-report.md
          retention-days: 7

  # Job 5: 性能测试（可选）
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [build]
    # 仅手动触发
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run benchmark
        run: |
          # TODO: 启动服务并运行压测脚本
          echo "Performance test placeholder"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
